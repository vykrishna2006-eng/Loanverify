services:
  # ── Backend API (FastAPI on Render) ─────────────────────────────────────────
  - type: web
    name: loanverify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: loanverify-postgres
          property: connectionString
      - key: MONGODB_URL
        sync: false          # set manually in Render dashboard
      - key: MONGODB_DB_NAME
        value: loanverify_auth
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # set in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: UPLOAD_DIR
        value: /tmp/uploads

  # ── PostgreSQL Database (Render managed) ─────────────────────────────────────
databases:
  - name: loanverify-postgres
    databaseName: loanverify
    user: loanverify
    plan: free
